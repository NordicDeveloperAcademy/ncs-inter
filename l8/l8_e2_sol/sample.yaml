sample:
  description: nRF Connect SDK Intermediate Course by Nordic Developer Academy (https://academy.nordicsemi.com/)
  name: nRF Connect SDK Intermediate Course - Lesson 8 Exercise 2 Solution

common: 
    sysbuild: true
    integration_platforms: 
      - nrf5340dk/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lc10dk/nrf54lc10a/cpuapp

    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp    
      - nrf54lc10dk/nrf54lc10a/cpuapp

    
tests:
  ncs_inter.l8.e2_sol:
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Hello from DevAcademy Intermediate, Lesson 8, Exercise 2"
    timeout: 15