CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Nordic_LBS"

# Enable the LBS service
CONFIG_BT_LBS=y
CONFIG_BT_LBS_POLL_BUTTON=y
CONFIG_DK_LIBRARY=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Carried over from Exercise 5: FOTA over Bluetooth LE (MCUboot is enabled in sysbuild.conf)
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
# Show OS/firmware version fields in the nRF Connect Device Manager app
CONFIG_MCUMGR_GRP_OS_INFO=y

# STEP 1.1 - Preserve Bluetooth bonds across a firmware upgrade.
# Because the device stores settings in ZMS/NVS, the OTA DFU sample auto-enables a basic-group
# "storage erase" command that lets the Device Manager app wipe the settings partition (and your
# bonds) during an update. Disable it so the bond survives the upgrade and the phone reconnects
# without re-pairing.
CONFIG_MCUMGR_GRP_ZBASIC_STORAGE_ERASE=n

# STEP 1.2 - Enable the Memfault SDK and set your nRF Cloud (powered by Memfault) project key
CONFIG_MEMFAULT=y
CONFIG_MEMFAULT_NCS_PROJECT_KEY="your-project-key-here"
CONFIG_MEMFAULT_LOG_LEVEL_INF=y
# Software type reported to nRF Cloud. Must match the OTA release's Software Type. nRF Cloud ties
# the nrf54l15dk hardware type to "main", so report "main" (NCS otherwise defaults this to "app").
CONFIG_MEMFAULT_NCS_FW_TYPE="main"

# STEP 1.3 - Enable the Memfault Diagnostic Service (MDS) so the device's data
# (current firmware version, heartbeats, crashes) reaches nRF Cloud over BLE.
# MDS access is gated behind an encrypted connection, so privacy/bonding is required.
CONFIG_BT_MDS=y
CONFIG_BT_PRIVACY=y

# STEP 1.4 - Provide the Memfault device serial automatically from the hardware UID
CONFIG_HW_ID_LIBRARY=y
CONFIG_HW_ID_LIBRARY_SOURCE_DEVICE_ID=y

# STEP 1.5 - Set the firmware version. The two strings must always match.
# The solution shows the second release (0.0.2) delivered over the air; the
# first image flashed to the device in the exercise is 0.0.1.
CONFIG_MEMFAULT_NCS_FW_VERSION_STATIC=y
CONFIG_MEMFAULT_NCS_FW_VERSION="0.0.2"
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.0.2"
