CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Nordic_LBS"

# Enable the LBS service
CONFIG_BT_LBS=y
CONFIG_BT_LBS_POLL_BUTTON=y
CONFIG_DK_LIBRARY=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Carried over from Exercise 5: FOTA over Bluetooth LE (MCUboot is enabled in sysbuild.conf)
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
# Show OS/firmware version fields in the nRF Connect Device Manager app
CONFIG_MCUMGR_GRP_OS_INFO=y

# STEP 1.1 - Preserve Bluetooth bonds across a firmware upgrade. The OTA DFU sample auto-enables a
# basic-group "storage erase" command (because settings live in ZMS/NVS) that lets the Device
# Manager app wipe the settings partition (and your bonds) during an update. Disable it.
# Hint: CONFIG_MCUMGR_GRP_ZBASIC_STORAGE_ERASE=n


# STEP 1.2 - Enable the Memfault SDK and set your nRF Cloud (powered by Memfault) project key
# Hint: CONFIG_MEMFAULT, CONFIG_MEMFAULT_NCS_PROJECT_KEY, CONFIG_MEMFAULT_LOG_LEVEL_INF
# Also pin the software type reported to nRF Cloud (the OTA release MUST use this same value;
# nRF Cloud ties the nrf54l15dk hardware type to "main"):
# Hint: CONFIG_MEMFAULT_NCS_FW_TYPE="main"


# STEP 1.3 - Enable the Memfault Diagnostic Service (MDS) so the device's data
# (current firmware version, heartbeats, crashes) reaches nRF Cloud over BLE.
# Hint: CONFIG_BT_MDS, CONFIG_BT_PRIVACY


# STEP 1.4 - Provide the Memfault device serial automatically from the hardware UID
# Hint: CONFIG_HW_ID_LIBRARY, CONFIG_HW_ID_LIBRARY_SOURCE_DEVICE_ID


# STEP 1.5 - Set the firmware version. The two strings must always match. Start at 0.0.1.
# Hint: CONFIG_MEMFAULT_NCS_FW_VERSION_STATIC, CONFIG_MEMFAULT_NCS_FW_VERSION="0.0.1",
#       CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.0.1"
